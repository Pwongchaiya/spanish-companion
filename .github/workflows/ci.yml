name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same versions as .pre-commit-config.yaml.
      - run: pip install black==26.5.1 flake8==7.3.0
      - run: black --check .
      - run: flake8

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - run: bandit -r api rag -ll -q  # medium+ severity
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high
        working-directory: frontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: spanish_companion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+pg8000://ci:ci@localhost:5432/spanish_companion_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pyaudio (via pipecat-ai[local]) compiles against portaudio; see Dockerfile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev
      # CPU-only torch: the default CUDA wheel is ~2 GB and nothing here uses a GPU.
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      # Audits the env just installed (transitive deps included) instead of re-resolving requirements.txt.
      # PYSEC-2026-3740: nltk (via pipecat-ai) model-path traversal, no fixed release yet; nothing here imports nltk.
      - run: pip install pip-audit && pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-3740
      - run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: python -m pytest -q
      # Scoring logic only; the real eval needs the ingested corpus and Gemini, so it stays manual.
      - run: python evals/run_eval.py --self-test
