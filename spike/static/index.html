<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebRTC spike</title></head>
<body>
<p>1. Click Start. 2. Allow mic. 3. If your own voice echoes back, the
round trip (browser mic -> server -> browser speaker) works.</p>
<button id="start">Start</button>
<p id="status">idle</p>
<audio id="remote" autoplay playsinline></audio>
<script>
const statusEl = document.getElementById("status");

document.getElementById("start").onclick = async () => {
  statusEl.textContent = "requesting mic...";
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  const pc = new RTCPeerConnection();
  stream.getTracks().forEach((track) => pc.addTrack(track, stream));
  pc.addTransceiver("audio", { direction: "recvonly" });
  pc.ontrack = (event) => {
    document.getElementById("remote").srcObject = event.streams[0];
  };
  pc.oniceconnectionstatechange = () => {
    statusEl.textContent = "ICE: " + pc.iceConnectionState;
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const res = await fetch("/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
  });
  const answer = await res.json();
  await pc.setRemoteDescription(answer);
};
</script>
</body>
</html>
