# Alembic config — Spanish Learning Companion (rag.brokers.chunk_repository.Base)

[alembic]
script_location = alembic

prepend_sys_path = .

version_locations = %(here)s/alembic/versions
version_path_separator = os

# sqlalchemy.url is intentionally left blank — alembic/env.py sets it at
# runtime from DATABASE_URL via python-dotenv. Never hardcode it here,
# never commit a real connection string (see CLAUDE.md Environment Variables).
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
